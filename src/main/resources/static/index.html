    <div class="toolbar-buttons"><span id="current-user" class="user-chip"></span><button class="secondary" onclick="setAllTargets(true)">全部展开</button><button class="secondary" onclick="setAllTargets(false)">全部收起</button><button class="secondary" onclick="logout()">退出登录</button></div>
  </div>
  <div class="filter-bar" aria-label="目标状态筛选"><span class="filter-label">状态筛选</span><button class="filter-option active" data-status-filter="all" onclick="setStatusFilter('all')">全部<span class="filter-count">0</span></button><button class="filter-option" data-status-filter="success" onclick="setStatusFilter('success')">最近成功<span class="filter-count">0</span></button><button class="filter-option" data-status-filter="failure" onclick="setStatusFilter('failure')">最近失败<span class="filter-count">0</span></button><button class="filter-option" data-status-filter="unrun" onclick="setStatusFilter('unrun')">未运行<span class="filter-count">0</span></button><button class="filter-option" data-status-filter="running" onclick="setStatusFilter('running')">运行中<span class="filter-count">0</span></button></div>
  <div id="targets"></div>
  <div class="actions footer-actions"><button class="secondary" onclick="addTarget()">＋ 新增目标</button><button onclick="saveTargets()">保存配置</button><button class="secondary" onclick="runNow(this)">▶ 立即执行</button><button class="secondary" onclick="retryFailedTargets(this)">↻ 失败重试</button><span id="status" class="status"></span></div>
  <dialog id="template-dialog" class="template-dialog"><div class="dialog-header"><h2>选择目标模板</h2><button class="dialog-close" onclick="this.closest('dialog').close()" aria-label="关闭">×</button></div><div class="template-content"><p class="template-note">选择模板后会新增并展开目标，localStorage 仅预填键名，请自行填写对应值。</p><div id="template-grid" class="template-grid"><div class="history-empty">正在加载模板…</div></div></div></dialog>
  <dialog id="history-dialog"><div class="dialog-header"><h2 id="history-title">运行记录</h2><button class="dialog-close" onclick="this.closest('dialog').close()" aria-label="关闭">×</button></div><p class="history-retention-note">每个目标仅保存最近 7 次运行记录，新的记录会自动替换最早的记录。</p><div id="history-content" class="history-content"></div></dialog>
  <script>
    const root=document.getElementById('targets'), status=document.getElementById('status'), currentUser=document.getElementById('current-user'), templateDialog=document.getElementById('template-dialog'), templateGrid=document.getElementById('template-grid'), historyDialog=document.getElementById('history-dialog'), historyTitle=document.getElementById('history-title'), historyContent=document.getElementById('history-content');
    let builtinTemplates={blank:{name:'',url:'',warmupPath:'/favicon.ico',localStorage:[]}};
    let latestHistories={},activeStatusFilter='all',csrfToken='',csrfHeaderName='X-CSRF-TOKEN';
    async function apiFetch(url,options={}){const method=(options.method||'GET').toUpperCase(),headers=new Headers(options.headers||{});if(!['GET','HEAD','OPTIONS'].includes(method)&&csrfToken)headers.set(csrfHeaderName,csrfToken);const response=await fetch(url,{...options,headers});if(response.status===401){location.replace('/login.html');throw Error('登录状态已失效，请重新登录')}return response}
    async function loadAuthentication(){const response=await fetch('/api/auth/status');if(!response.ok)throw Error('认证状态加载失败');const auth=await response.json();if(!auth.authenticated){location.replace('/login.html');throw Error('请先登录')}csrfToken=auth.csrfToken;csrfHeaderName=auth.csrfHeaderName;currentUser.textContent='用户：'+auth.username}
    async function logout(){const response=await apiFetch('/api/auth/logout',{method:'POST'});if(!response.ok)throw Error('退出登录失败');location.replace('/login.html')}
    function targetStatus(url){const record=latestHistories[url];return record?(record.success?'success':'failure'):'unrun'}
    function setStatusFilter(filter){activeStatusFilter=filter;applyStatusFilter()}
    function applyStatusFilter(){const cards=[...root.querySelectorAll('.target-card')],counts={all:cards.length,success:0,failure:0,unrun:0,running:0};let visible=0;cards.forEach(card=>{const state=card.dataset.status||'unrun';counts[state]++;card.hidden=activeStatusFilter!=='all'&&state!==activeStatusFilter;if(!card.hidden)visible++});root.classList.toggle('filter-empty',cards.length>0&&visible===0);document.querySelectorAll('[data-status-filter]').forEach(button=>{const filter=button.dataset.statusFilter;button.classList.toggle('active',filter===activeStatusFilter);button.setAttribute('aria-pressed',filter===activeStatusFilter);button.querySelector('.filter-count').textContent=counts[filter]||0})}
    function statusBadge(url){const record=latestHistories[url];if(!record)return '<button type="button" class="latest-status none" title="点击单独重试" onclick="retryStatusBadge(event,this)">未运行 · 点击重试</button>';if(!record.success)return '<button type="button" class="latest-status failure" title="'+esc(formatHistoryTime(record.executedAt)+' · '+(record.message||'')+' · 点击单独重试')+'" onclick="retryStatusBadge(event,this)">最近失败 · 点击重试</button>';return '<span class="latest-status success" title="'+esc(formatHistoryTime(record.executedAt)+' · '+(record.message||''))+'">最近成功</span>'}
    function render(items){root.innerHTML='';items.map((t,i)=>({t,number:i+1})).reverse().forEach(({t,number})=>{const e=document.createElement('details'),locked=!!t.templateId,readonly=locked?' readonly':'',storageItems=t.localStorage||[],storageHtml=locked&&!storageItems.length?'':'<details class="storage"><summary>localStorage（'+storageItems.length+' 项'+(locked?'，value 必填':'')+'）</summary><div class="storage-items">'+storageItems.map(item=>storageRow(item,locked)).join('')+'</div>'+(locked?'':'<button type="button" class="small" onclick="addStorage(this)">新增键值</button>')+'</details>';e.className='card target-card';e.dataset.status=targetStatus(t.url);if(locked)e.dataset.templateId=t.templateId;e.innerHTML='<summary class="target-summary">目标 '+number+'：'+esc(t.name||t.url||'未命名')+' '+targetUrlLink(t.url)+statusBadge(t.url)+'</summary><div class="target-form"><div class="grid"><div><label>URL *</label><input data-f="url" placeholder="https://example.com/" value="'+esc(t.url||'')+'" onblur="fillNameFromUrl(this)"'+readonly+'></div><div><label>名称 *</label><input data-f="name" placeholder="自动取 URL 域名" value="'+esc(t.name||'')+'"'+readonly+'></div><div><label>预热路径</label><input data-f="warmupPath" placeholder="/favicon.ico" value="'+esc(t.warmupPath||'/favicon.ico')+'"'+readonly+'></div></div>'+storageHtml+'<div class="target-actions"><div class="actions"><button type="button" onclick="retryTarget(this)">单独重试</button><button type="button" class="secondary history-button" onclick="showHistory(this)">查看最近 7 次记录</button></div><button type="button" class="danger" onclick="removeTarget(this)">删除目标</button></div></div>';root.appendChild(e)});applyStatusFilter()}
    function storageRow(item,locked=false){return '<div class="storage-row"><input data-f="storage-key" placeholder="键，例如 token" value="'+esc(item.key||'')+'"'+(locked?' readonly':'')+'><input data-f="storage-value" placeholder="'+(locked?'必填 value':'值')+'" value="'+esc(item.value||'')+'"'+(locked?' data-template-required="true" required':'')+'>'+(locked?'':'<button type="button" class="danger small" onclick="this.parentElement.remove()">删除</button>')+'</div>'}
    function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function targetUrlLink(url){const value=String(url||'').trim();if(!value)return '<span class="target-url"><span class="target-url-text"><span class="target-url-path">未配置 URL</span></span></span>';try{const parsed=new URL(value);if(!['http:','https:'].includes(parsed.protocol))throw Error();const suffix=(parsed.pathname==='/'?'':parsed.pathname)+parsed.search+parsed.hash,content='<span class="target-url-text"><span class="target-url-host">'+esc(parsed.host)+'</span><span class="target-url-path">'+esc(suffix)+'</span></span>';return '<a class="target-url" href="'+esc(value)+'" target="_blank" rel="noopener noreferrer" title="打开 '+esc(value)+'" aria-label="打开 '+esc(value)+'" onclick="event.stopPropagation()">'+content+'</a>'}catch(e){return '<span class="target-url"><span class="target-url-text"><span class="target-url-path">'+esc(value)+'</span></span></span>'}}
    function readStorage(c){return [...c.querySelectorAll('.storage-row')].map(r=>({key:r.querySelector('[data-f="storage-key"]').value,value:r.querySelector('[data-f="storage-value"]').value})).filter(x=>x.key.trim()||x.value.trim())}
    function fillNameFromUrl(input){const name=input.closest('.target-card').querySelector('[data-f="name"]');if(name.value.trim()||!input.value.trim())return;try{name.value=new URL(input.value.trim()).hostname}catch(e){}}
    function read(){return [...root.children].map(c=>{const g=f=>c.querySelector('[data-f="'+f+'"]').value.trim();return {templateId:c.dataset.templateId||null,name:g('name'),url:g('url'),warmupPath:g('warmupPath'),localStorage:readStorage(c)}}).reverse()}
    function setAllTargets(open){document.querySelectorAll('.target-card').forEach(e=>e.open=open)}
    function setTheme(theme,persist=true){const names={indigo:'蓝色',forest:'绿色',dark:'黑色',red:'红色',orange:'橙色',yellow:'黄色',purple:'紫色',pink:'粉色'};if(!names[theme])theme='indigo';document.documentElement.dataset.theme=theme;document.getElementById('theme-current').textContent=names[theme];document.querySelectorAll('[data-theme-option]').forEach(button=>{const active=button.dataset.themeOption===theme;button.classList.toggle('active',active);button.setAttribute('aria-pressed',active)});document.getElementById('theme-picker').open=false;if(persist)try{localStorage.setItem('selenium-tool-theme',theme)}catch(e){}}
    function setVisualStyle(style,persist=true){const names={glass:'毛玻璃',neumorphism:'新拟态',minimal:'极简留白',cyberpunk:'赛博 / 霓虹',brutalism:'野兽派',spatial:'3D 空间'};if(!names[style])style='glass';document.documentElement.dataset.visualStyle=style;document.getElementById('style-current').textContent=names[style];document.querySelectorAll('[data-style-option]').forEach(button=>{const active=button.dataset.styleOption===style;button.classList.toggle('active',active);button.setAttribute('aria-pressed',active)});document.getElementById('style-picker').open=false;if(persist)try{localStorage.setItem('selenium-tool-visual-style',style)}catch(e){}}
    function addStorage(button){button.previousElementSibling.insertAdjacentHTML('beforeend',storageRow({key:'',value:''}))}
    function removeTarget(button){button.closest('.target-card').remove();applyStatusFilter()}
    function addTarget(){templateDialog.showModal()}
    function renderTemplateOptions(templates){builtinTemplates={blank:{name:'',url:'',warmupPath:'/favicon.ico',localStorage:[]}};templates.forEach(template=>{builtinTemplates[template.id]={name:template.name,url:template.url,warmupPath:template.warmupPath,localStorage:(template.localStorageKeys||[]).map(key=>({key,value:''}))}});const blank='<button type="button" class="template-card" data-template-id="blank" onclick="createTarget(this.dataset.templateId)"><span class="template-name">空白目标</span><span class="template-url">从空白配置开始</span><span class="template-meta"><span>默认预热路径</span></span></button>';templateGrid.innerHTML=blank+templates.map(template=>{const keys=template.localStorageKeys||[],meta=[...(template.warmupPath!='/favicon.ico'?['预热 '+template.warmupPath]:[]),...keys];return '<button type="button" class="template-card" data-template-id="'+esc(template.id)+'" onclick="createTarget(this.dataset.templateId)"><span class="template-name">'+esc(template.name)+'</span><span class="template-url">'+esc(template.url)+'</span><span class="template-meta">'+(meta.length?meta.map(item=>'<span>'+esc(item)+'</span>').join(''):'<span>默认配置</span>')+'</span></button>'}).join('')}
    async function loadTemplates(){try{const r=await apiFetch('/api/automation/target-templates');if(!r.ok)throw Error('模板加载失败');renderTemplateOptions(await r.json())}catch(e){renderTemplateOptions([]);showStatus(e.message,true)}}
    function createTarget(templateId){const source=builtinTemplates[templateId];if(!source)return;const target={templateId:templateId==='blank'?null:templateId,name:source.name,url:source.url,warmupPath:source.warmupPath,localStorage:source.localStorage.map(item=>({...item}))};render([...read(),target]);templateDialog.close();const card=root.firstElementChild;card.open=true;if(target.templateId&&target.localStorage.length)card.querySelector('.storage').open=true}
    function formatHistoryTime(value){const date=new Date(value);return Number.isNaN(date.getTime())?value:date.toLocaleString('zh-CN',{hour12:false})}
    async function showHistory(button){const card=button.closest('.target-card'),url=card.querySelector('[data-f="url"]').value.trim(),name=card.querySelector('[data-f="name"]').value.trim();historyTitle.textContent='运行记录 · '+(name||url||'未命名目标');historyContent.innerHTML='<div class="history-empty">正在加载…</div>';historyDialog.showModal();if(!url){historyContent.innerHTML='<div class="history-empty">请先填写并保存目标 URL</div>';return}try{const r=await apiFetch('/api/automation/targets/history?url='+encodeURIComponent(url));if(!r.ok)throw Error('加载失败');const records=await r.json();historyContent.innerHTML=records.length?records.map(record=>'<div class="history-item"><span class="history-time">'+esc(formatHistoryTime(record.executedAt))+'</span><span class="history-result '+(record.success?'success':'failure')+'">'+(record.success?'成功':'失败')+'</span><span class="history-message">'+esc(record.message||'无详细信息')+'</span></div>').join(''):'<div class="history-empty">暂无运行记录</div>'}catch(e){historyContent.innerHTML='<div class="history-empty">运行记录加载失败：'+esc(e.message)+'</div>'}}
    function setCardRunning(card){const badge=card.querySelector('.latest-status');card.dataset.status='running';badge.className='latest-status running';badge.textContent='运行中';badge.removeAttribute('title');applyStatusFilter()}
    function refreshCardBadge(card,url){const current=card.querySelector('.latest-status'),template=document.createElement('template');card.dataset.status=targetStatus(url);template.innerHTML=statusBadge(url);current.replaceWith(template.content.firstElementChild);applyStatusFilter()}
    async function refreshLatestBadges(){const r=await apiFetch('/api/automation/targets/history/latest');if(!r.ok)throw Error('最新运行状态加载失败');latestHistories=await r.json();document.querySelectorAll('.target-card').forEach(card=>refreshCardBadge(card,card.querySelector('[data-f="url"]').value.trim()))}
    async function waitForTaskCompletion(){for(let i=0;i<180;i++){await new Promise(resolve=>setTimeout(resolve,2000));const r=await apiFetch('/api/automation/status');if(r.ok&&!(await r.json()).running)return}throw Error('等待任务完成超时，请稍后刷新页面查看')}
    function retryStatusBadge(event,button){event.preventDefault();event.stopPropagation();retryTarget(button)}
    async function retryTarget(button){const card=button.closest('.target-card'),url=card.querySelector('[data-f="url"]').value.trim();if(!url){showStatus('请先填写并保存目标 URL',true);return}button.disabled=true;const originalText=button.textContent;try{const r=await apiFetch('/api/automation/targets/retry?url='+encodeURIComponent(url),{method:'POST'}),data=await r.json();if(!r.ok)throw Error(data.message||'重试提交失败');button.textContent='重试中…';setCardRunning(card);showStatus(data.message);await waitForTaskCompletion();const historyResponse=await apiFetch('/api/automation/targets/history?url='+encodeURIComponent(url));if(!historyResponse.ok)throw Error('最新运行状态加载失败');const records=await historyResponse.json();if(records.length)latestHistories[url]=records[0];else delete latestHistories[url];refreshCardBadge(card,url);showStatus('目标重试完成')}catch(e){showStatus(e.message,true);refreshCardBadge(card,url)}finally{button.disabled=false;button.textContent=originalText}}
    async function retryFailedTargets(button){const eligible=[...document.querySelectorAll('.target-card')].some(card=>{const record=latestHistories[card.querySelector('[data-f="url"]').value.trim()];return !record||!record.success});if(!eligible){showStatus('没有需要重试的目标');return}button.disabled=true;const originalText=button.textContent;try{const r=await apiFetch('/api/automation/targets/retry-failed',{method:'POST'}),data=await r.json();if(r.status===409){button.textContent='执行中…';showStatus(data.message,true);await waitForTaskCompletion();await refreshLatestBadges();showStatus('当前任务已结束');return}if(!r.ok)throw Error(data.message||'失败重试提交失败');showStatus(data.message);if(!data.accepted)return;button.textContent='重试中…';const targetUrls=new Set(data.targetUrls||[]);document.querySelectorAll('.target-card').forEach(card=>{const url=card.querySelector('[data-f="url"]').value.trim();if(targetUrls.has(url))setCardRunning(card)});await waitForTaskCompletion();await refreshLatestBadges();showStatus('失败目标重试完成')}catch(e){showStatus(e.message,true);await refreshLatestBadges().catch(()=>{})}finally{button.disabled=false;button.textContent=originalText}}
    function showStatus(message,error=false){status.textContent=message;status.classList.toggle('error',error)}
    function validateTemplateValues(){const missing=[...root.querySelectorAll('[data-template-required]')].find(input=>!input.value.trim());if(!missing)return true;const card=missing.closest('.target-card'),key=missing.parentElement.querySelector('[data-f="storage-key"]').value;card.open=true;missing.closest('.storage').open=true;missing.focus();showStatus('模板目标的 localStorage['+key+'] value 为必填项',true);return false}
    async function load(){await loadAuthentication();const [targetsResponse,historyResponse]=await Promise.all([apiFetch('/api/automation/targets'),apiFetch('/api/automation/targets/history/latest'),loadTemplates()]);if(!targetsResponse.ok||!historyResponse.ok)throw Error('加载失败');latestHistories=await historyResponse.json();render(await targetsResponse.json())}
    async function saveTargets(){if(!validateTemplateValues())return;try{const r=await apiFetch('/api/automation/targets',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(read())});if(!r.ok)throw Error(await r.text());render(await r.json());showStatus('已保存并生效');}catch(e){showStatus('保存失败：'+e.message,true)}}
    async function runNow(button){button.disabled=true;const originalText=button.textContent;try{const r=await apiFetch('/api/automation/run',{method:'POST'}),data=await r.json();if(r.status===409){button.textContent='执行中…';showStatus(data.message,true);await waitForTaskCompletion();await refreshLatestBadges();showStatus('当前任务已结束');return}if(!r.ok)throw Error(data.message||'提交失败');button.textContent='执行中…';document.querySelectorAll('.target-card').forEach(setCardRunning);showStatus(data.message||'任务已提交');await waitForTaskCompletion();await refreshLatestBadges();showStatus('任务执行完成')}catch(e){showStatus(e.message,true);await refreshLatestBadges().catch(()=>{})}finally{button.disabled=false;button.textContent=originalText}}
    setTheme(document.documentElement.dataset.theme||'indigo',false);
    setVisualStyle(document.documentElement.dataset.visualStyle||'glass',false);
    document.querySelectorAll('.toolbar details').forEach(picker=>picker.addEventListener('toggle',()=>{if(picker.open)document.querySelectorAll('.toolbar details').forEach(other=>{if(other!==picker)other.open=false})}));
    if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.addEventListener('pointermove',event=>{if(document.documentElement.dataset.visualStyle!=='spatial')return;document.documentElement.style.setProperty('--spatial-x',((event.clientX/innerWidth)-.5)*-18+'px');document.documentElement.style.setProperty('--spatial-y',((event.clientY/innerHeight)-.5)*-18+'px')},{passive:true});
    load().catch(e=>showStatus(e.message,true));
  </script>
</body></html>
